<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>Profile preview</title>
<style>
  body { margin: 0; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0d1117; color: #e6edf3; }
  body.light { background: #fff; color: #1f2328; }
  .box { max-width: 880px; margin: 24px auto; border: 1px solid #30363d; border-radius: 6px; padding: 24px; }
  .light .box { border-color: #d0d7de; }
  .box > p { margin: 0 0 16px; }
  img { max-width: 100%; vertical-align: middle; }
  button { margin: 12px; }
</style></head>
<body>
<button onclick="document.body.classList.toggle('light')">toggle GitHub light / dark</button>
<div class="box" id="md"></div>
<script>
fetch('README.md').then(r => r.text()).then(md => {
  document.getElementById('md').innerHTML = md.split(/\n\s*\n/).map(b => '<p>' + b + '</p>').join('');
});
</script>
</body></html>
